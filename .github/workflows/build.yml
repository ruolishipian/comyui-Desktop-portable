name: Electron 极简构建 & 双版本发布

permissions:
  contents: write

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      GYP_MSVS_VERSION: 2022
      npm_config_msvs_version: 2022
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: 安装Python依赖（distutils兼容）
        run: pip install setuptools
        shell: pwsh

      - name: 诊断VS安装
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -all -products * -format json
          } else {
            Write-Host "vswhere.exe not found"
          }
        shell: pwsh

      - name: 安装依赖（使用国内镜像）
        run: |
          npm config set registry https://registry.npmmirror.com
          npm install
        shell: pwsh

      - name: 修补node-pty并重新编译
        run: |
          node scripts/patch-node-pty.js
          npx electron-rebuild -f -w node-pty
        shell: pwsh

      - name: 清理electron-builder缓存
        run: |
          Remove-Item -Recurse -Force $env:LOCALAPPDATA\electron-builder\Cache -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force node_modules\.cache\electron-builder -ErrorAction SilentlyContinue
        shell: pwsh
        continue-on-error: true

      - name: 构建项目
        run: npm run build
        shell: pwsh

      - name: 检查构建产物
        run: |
          Write-Host "检查 dist 目录结构:"
          Get-ChildItem -Path dist -Recurse -Depth 2 | Select-Object FullName
          Write-Host "`n检查 main.js 是否存在:"
          Test-Path "dist\src\main.js"
        shell: pwsh

      - name: 打包 (仅安装包+压缩包)
        run: |
          npx electron-builder --win --x64 --publish never
        shell: pwsh

      - name: 上传到 Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            dist/*.zip
            dist/latest.yml
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传到 Artifacts (备用)
        uses: actions/upload-artifact@v4
        with:
          name: ComfyUI_Electron-Core
          path: |
            dist/*.exe
            dist/*.zip
          retention-days: 30
